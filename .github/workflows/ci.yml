# Everything here runs without the private labels or screenshots: lint, unit and smoke tests,
# and the browser build. Accuracy (`recognizer eval`) is checked by a maintainer before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked && uv run recognizer write-fixtures
      - run: npm ci
        working-directory: web
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # its optional CUDA binaries; the parity harness runs on CPU
      - run: npx tsc -p tsconfig.json
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
