[project]
name = "team-recognizer"
version = "0.1.0"
description = "Identify Pokémon GO tournament teams from broadcast overlay screenshots"
requires-python = ">=3.12,<3.13"
# Runtime (inference) dependencies only: this is what the Vercel deployment installs.
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "onnxruntime",
    "rapidocr-onnxruntime",
    "rapidfuzz",
    "fastapi",
    "python-multipart",
]

[project.optional-dependencies]
# Building references, training and evaluating: `uv sync --extra train`.
train = [
    "torch",
    "torchvision",
    "timm",
    "onnx",
    "onnxscript",
    "scikit-learn",
    "scipy",
    "requests",
    "tqdm",
    "uvicorn",
]

[project.scripts]
recognizer = "recognizer.cli:main"

[tool.vercel]
entrypoint = "server:app"

[tool.uv]
# rapidocr asks for the GUI build of OpenCV; the headless build provides the same cv2 module
# without needing libGL, which serverless Linux images don't have.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recognizer"]
